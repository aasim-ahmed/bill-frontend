<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- Title -->
    <title>NazMart | Retail Billing & Inventory Management</title>

    <!-- SEO -->
    <meta
      name="description"
      content="NazMart is a modern retail billing and inventory management system designed for businesses. Manage billing, inventory, barcode scanning, customers, sales analytics, and reports with ease."
    />

    <meta
      name="keywords"
      content="NazMart, POS Software, Retail Billing Software, Inventory Management, Billing System, Barcode Billing, Retail POS, Store Management, GST Billing, Billing Application"
    />

    <meta name="author" content="Zapprex Technologies" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0F172A" />

    <!-- Canonical -->
    <link rel="canonical" href="https://nazmart.store" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />

    <!-- Open Graph (LinkedIn / Facebook / WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NazMart" />
    <meta
      property="og:title"
      content="NazMart | Retail Billing & Inventory Management"
    />
    <meta
      property="og:description"
      content="Modern POS and inventory management software for retail businesses."
    />
    <meta property="og:url" content="https://nazmart.store" />
    <meta property="og:image" content="https://nazmart.store/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="NazMart | Retail Billing & Inventory Management"
    />
    <meta
      name="twitter:description"
      content="Modern POS and inventory management software for retail businesses."
    />
    <meta
      name="twitter:image"
      content="https://nazmart.store/og-image.png"
    />
